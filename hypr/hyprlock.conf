# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    path = /home/wallpaper.jpg
    blur_passes = 4 
    blur_size = 8
    noise = 0.0117
    contrast = 1.2
    brightness = 0.95
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# =========================
# FECHA (arriba, chica)
# =========================
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d de %B')"
    color = rgba(255, 255, 255, 0.75)

    font_size = 22
    font_family = SF Pro Display Medium

    position = 0, 370
    halign = center
    valign = center
}

# =========================
# HORA GRANDE estilo macOS
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(235, 240, 255, 0.88)

    font_size = 110
    font_family = SF Pro Display Bold

    position = 0, 300
    halign = center
    valign = center
}

# =========================
# INPUT PASSWORD
# =========================
input-field {
    monitor =

    size = 280, 55
    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,0)
    font_color = rgba(255,255,255,0.9)

    fade_on_empty = false
    placeholder_text =

    rounding = 14
    check_color = rgba(255,255,255,0.25)
    fail_color = rgba(255,80,80,0.9)

}
